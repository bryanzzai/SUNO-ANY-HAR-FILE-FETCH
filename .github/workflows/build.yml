name: Build

on:
  push:
    branches: [ main, subdl-series-download ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/SubdlProDownload/SubdlProDownload.csproj

      - name: Build
        run: dotnet build src/SubdlProDownload/SubdlProDownload.csproj --configuration Release --no-restore
