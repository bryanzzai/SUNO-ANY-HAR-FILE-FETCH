name: Build

on:
  push:
    branches: [ main, suno-raw-har-scanner ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/suno-raw-har-scanner/suno-raw-har-scanner.csproj

      - name: Publish self-contained Windows app
        run: dotnet publish src/suno-raw-har-scanner/suno-raw-har-scanner.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifact/suno-raw-har-scanner

      - name: Verify self-contained package
        shell: pwsh
        run: |
          $exe = 'artifact/suno-raw-har-scanner/suno-raw-har-scanner.exe'
          if (-not (Test-Path $exe)) { throw "Expected executable was not produced: $exe" }
          if (-not (Test-Path 'artifact/suno-raw-har-scanner/coreclr.dll')) { throw 'Self-contained runtime library coreclr.dll was not produced.' }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: suno-raw-har-scanner-win-x64
          path: artifact/suno-raw-har-scanner
          if-no-files-found: error
