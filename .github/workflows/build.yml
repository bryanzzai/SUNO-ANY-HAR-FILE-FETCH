name: Build

on:
  push:
    branches: [ main, suno-raw-har-scanner ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/suno-raw-har-scanner/suno-raw-har-scanner.csproj

      - name: Build
        run: dotnet build src/suno-raw-har-scanner/suno-raw-har-scanner.csproj --configuration Release --no-restore

      - name: Verify executable name
        shell: pwsh
        run: |
          $exe = 'src/suno-raw-har-scanner/bin/Release/net10.0-windows/suno-raw-har-scanner.exe'
          if (-not (Test-Path $exe)) { throw "Expected executable was not produced: $exe" }
